services:
  # 1. Microservicio Node.js (Cálculo Estadístico)
  - type: web
    name: interseguro-api-node
    runtime: docker
    dockerfilePath: ./api-node/Dockerfile
    dockerContext: ./api-node
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        value: interseguro_super_secret_key_2024
      - key: NODE_ENV
        value: production

  # 2. Microservicio Go (Factorización QR + Rotación)
  - type: web
    name: interseguro-api-go
    runtime: docker
    dockerfilePath: ./api-go/Dockerfile
    dockerContext: ./api-go
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        value: interseguro_super_secret_key_2024
      - key: NODE_API_URL
        value: https://interseguro-api-node.onrender.com

  # 3. Aplicación Web Frontend (Sitio Estático ultra-rápido en CDN de Render)
  - type: static
    name: interseguro-frontend
    staticPublishPath: ./frontend
    plan: free
